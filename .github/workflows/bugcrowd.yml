name: Bugcrowd Discord Notifier

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check-programs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and Check Bugcrowd
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python check_bugcrowd.py

      - name: Commit state file changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update known Bugcrowd targets state [skip ci]"
          file_pattern: "known_programs.json"
