name: Bugcrowd Scope Monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Bugcrowd Monitor
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        python monitor.py

    - name: Commit & Push Updated Scope State
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        
        if [ -f previous_scopes.json ]; then
          git add previous_scopes.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update bugcrowd target state [skip ci]"
            git push
          else
            echo "No changes detected in scope state."
          fi
        else
          echo "previous_scopes.json was not generated."
        fi
